services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: lunia
      POSTGRES_PASSWORD: lunia_local_only
      POSTGRES_DB: lunia
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - lunia_db:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U lunia -d lunia']
      interval: 5s
      retries: 10
volumes:
  lunia_db:
