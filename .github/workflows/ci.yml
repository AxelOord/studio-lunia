name: Foundation checks
on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: ['feature/**', develop, master]
permissions:
  contents: read
  pull-requests: read
  issues: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/develop' && github.ref != 'refs/heads/master' }}
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: lunia
          POSTGRES_PASSWORD: synthetic_ci_only
          POSTGRES_DB: lunia
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U lunia -d lunia"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://lunia:synthetic_ci_only@localhost:5432/lunia
      PAYLOAD_SECRET: synthetic-ci-only-not-a-deployed-secret-123456789
      SEED_EMAIL: editor@example.test
      SEED_PASSWORD: synthetic-ci-only-password-123456789
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node 24 action runtime
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0, Node 24 action runtime
        with:
          node-version-file: .node-version
          cache: npm
      - name: Verify application Node version
        run: node -e 'const fs = require("node:fs"); const expected = fs.readFileSync(".node-version", "utf8").trim(); console.log(`Application Node ${process.version}`); if (process.versions.node !== expected) process.exit(1)'
      - run: npm ci
      - name: Check new commit messages and PR title
        if: github.event_name == 'pull_request'
        run: npm run commit:check -- --pr
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
      - name: Validate explicit completion and release promotion
        if: github.event_name == 'pull_request'
        run: node scripts/check-release-pr.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: npm run generate:types && npm run generate:importmap
      - name: Lint, types, formatting and spec structure
        run: npm run check:static
      - name: Application unit tests
        run: npm run test:unit
      - name: Bootstrap security, hooks and release tooling
        run: npm run test:tooling
      - name: Isolated PostgreSQL integration tests
        run: npm run test:integration
      - name: Build and generated-file consistency
        run: npm run build && npm run check:generated
      - name: Built deployment dependency tests
        run: npm run test:build
      - run: npx playwright install --with-deps chromium
      - name: Browser journeys, showcase and upload metadata
        run: npm run test:e2e
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1, Node 24 action runtime
        if: always()
        with:
          name: verification-evidence
          path: |
            test-results/
            playwright-report/
          retention-days: 7

  development-status:
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop' && vars.LUNIA_STATUS_AUTOMATION_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: project-status
    permissions:
      contents: read
      pull-requests: read
      issues: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .node-version
      - run: node scripts/release-github.mjs development
        env:
          GITHUB_TOKEN: ${{ github.token }}
          LUNIA_PROJECT_TOKEN: ${{ secrets.LUNIA_PROJECT_TOKEN }}
          LUNIA_PROJECT_OWNER: ${{ vars.LUNIA_PROJECT_OWNER }}
          LUNIA_PROJECT_NUMBER: ${{ vars.LUNIA_PROJECT_NUMBER }}

  publish-release:
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/master' && vars.LUNIA_RELEASE_AUTOMATION_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: release-automation
    permissions:
      contents: write
      pull-requests: read
      issues: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .node-version
      - run: node scripts/release-github.mjs publish
        env:
          GITHUB_TOKEN: ${{ github.token }}

  release-status:
    needs: publish-release
    if: github.event_name == 'push' && github.ref == 'refs/heads/master' && vars.LUNIA_RELEASE_AUTOMATION_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: project-status
    permissions:
      contents: read
      pull-requests: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .node-version
      - run: node scripts/release-github.mjs close
        env:
          GITHUB_TOKEN: ${{ github.token }}
          LUNIA_PROJECT_TOKEN: ${{ secrets.LUNIA_PROJECT_TOKEN }}
          LUNIA_PROJECT_OWNER: ${{ vars.LUNIA_PROJECT_OWNER }}
          LUNIA_PROJECT_NUMBER: ${{ vars.LUNIA_PROJECT_NUMBER }}
